# Overrides applied by service.sh after boot. NOTHING is active by default:
# uncomment a line, reboot, then read tuner.log.
#
# Formats (one directive per line):
#   prop:<property.name>=<value>                    -> resetprop -n
#   setting:<global|secure|system>:<key>=<value>    -> settings put
#   exec:<shell command>                            -> run as root (20 s max)
#   restart:<init service>                          -> stop/start at the end
#
# ---------------------------------------------------------------------------
# What investigation found on this headset (A8110, Pico OS 5.13.7):
#   daemon : /system/bin/pvrtrackingservice (init: pvrtrackingservice,
#            binder: pvrtracking). Trackers are code-named "Swift".
#   app    : com.pvr.swift (SwiftService)
#   No IR/IMU fusion weight is exposed (no prop, no config file).
#   The full-frequency hold is handled by smart.sh; the line below is the
#   same lever, for manual use only.
# ---------------------------------------------------------------------------
#
# 1) Keep trackers at full frequency (state 3) for a fixed time (ms).
#    Only lasts while the command runs: prefer smart.sh.
# exec:/system/bin/pvrtracking_swift_test setKeepTrackerFullFrequencyFlag 1 86400000
#
# 2) Swift algorithm post-processing (read by libAlgSwiftTracking.so; values
#    and effect unknown, untested):
# prop:persist.pxr.picoSwiftTracking.EnablePP=1
# restart:pvrtrackingservice
#
# To replace a read-only file (/system, /vendor), put the edited copy in the
# module under system/... or system/vendor/... and reboot: Magisk overlays
# it without touching the partition.
