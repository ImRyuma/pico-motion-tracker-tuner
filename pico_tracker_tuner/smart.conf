# Pico Motion Tracker smart mode (v0.3). Reloaded live, no reboot needed.
#
# MODE=auto    while moving: stock Pico OS behavior (already full frequency
#              during a SteamVR session).
#              Still for STILL_HOLD s during a session: hold full frequency
#              to prevent sleep and SteamVR dropouts (lying down).
#              Released as soon as the trackers move again.
#              Outside a session: stock behavior.
# MODE=always  hold as soon as a tracker is connected.
# MODE=off     stock behavior at all times.
MODE=auto

# Seconds of stillness before holding (Pico sleeps trackers after ~60 s)
STILL_HOLD=20

# Seconds a session stays active after the last sign of activity
SESSION_LINGER=300

# Polling intervals (s): moving, still, while holding
POLL_MOVE=15
POLL_STILL=5
POLL_HOLD=10

# Session detection fallback: foreground app (checked once a minute)
STREAM_PKGS="picostreamassistant bstreamassistant"

# Duration requested for each hold (ms); renewed automatically
HOLD_MS=3600000
